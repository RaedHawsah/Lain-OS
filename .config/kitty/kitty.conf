# ==============================================================================
#                 LAIN BEIGE & PINK - FULL KITTY CONFIG
# ==============================================================================

# --- [ 1. FONTS CONFIGURATION ] ---
font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- [ 2. WINDOW & PADDING ] ---
window_padding_width    12
confirm_os_window_close 0
remember_window_size    yes
initial_window_width    950
initial_window_height   600
hide_window_decorations no

# --- [ 3. CURSOR & MOUSE ] ---
cursor                  #F2A3B3
cursor_text_color       #1A1416
cursor_shape            beam
cursor_beam_thickness   1.8
cursor_blink_interval   0.5
scrollback_lines        10000
mouse_hide_wait         3.0
url_color               #F2A3B3
url_style               curly
detect_urls             yes

# --- [ 4. TAB BAR STYLING ] ---
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #1A1416
active_tab_background   #F2A3B3
active_tab_font_style   bold
inactive_tab_foreground #C2B2AF
inactive_tab_background #261E20

# --- [ 5. COLOR SCHEME: LAIN BEIGE & PINK ] ---
foreground              #F5E0DC
background              #1A1416
selection_foreground    #1A1416
selection_background    #F2A3B3

# --- ANSI 16 COLORS ---

# Black
color0  #261E20
color8  #3D2F33

# Red (Hot Pink / Magenta accents)
color1  #E93CAC
color9  #F2A3B3

# Green (Soft Beige-Green)
color2  #A8D7C4
color10 #C6EAE3

# Yellow (Warm Cream & Beige)
color3  #E8DAC1
color11 #F5EBD0

# Blue (Muted Dusty Purple)
color4  #A78A95
color12 #C2A4AF

# Magenta (Lain Signature Pink)
color5  #F7A8B8
color13 #FFC0CB

# Cyan (Muted Ice Grey)
color6  #B8C9C9
color14 #D8E5E5

# White (Warm Off-White / Beige)
color7  #C2B2AF
color15 #F5E0DC
